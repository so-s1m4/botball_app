name: Test, build and release macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.2 and macOS template
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.request, zipfile
          base = 'https://github.com/godotengine/godot/releases/download/4.5.2-stable/'
          urllib.request.urlretrieve(base + 'Godot_v4.5.2-stable_linux.x86_64.zip', '/tmp/godot.zip')
          with zipfile.ZipFile('/tmp/godot.zip') as z:
              z.extractall('/tmp/godot-bin')
          os.chmod('/tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64', 0o755)
          urllib.request.urlretrieve(base + 'Godot_v4.5.2-stable_export_templates.tpz', '/tmp/templates.tpz')
          target = pathlib.Path.home() / '.local/share/godot/export_templates/4.5.2.stable'
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('/tmp/templates.tpz') as z:
              (target / 'macos.zip').write_bytes(z.read('templates/macos.zip'))
          PY
      - name: Import project
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --editor --import --quit
      - name: Test simulation
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/smoke.gd --fixed-fps 120
      - name: Test parts and constructor
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/parts.gd
      - name: Test mechanical connections
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/connections.gd
      - name: Test LEGO tyre assembly
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/tires.gd
      - name: Test simple assembly
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/easy.gd
      - name: Test constructor usability and model reuse
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/usability.gd
      - name: Test fullscreen and constructor layout
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/layout.gd
      - name: Test playground camera controls
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/playground_camera.gd
      - name: Test map switching and runtime GLB import
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/maps.gd
      - name: Test assembled robot actuators and programs
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/programs.gd --fixed-fps 120
      - name: Test servo horn and LEGO gear attachments
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/mechanisms.gd
      - name: Test gear trains, rack lift, load and limits
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/transmissions.gd --fixed-fps 120
      - name: Test ready robot on application startup
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/starter.gd --fixed-fps 120
      - name: Test mass, balance, traction and tipping
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/physics.gd --fixed-fps 120
      - name: Test compliant gripper contacts, friction and release
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/gripper.gd --fixed-fps 120
      - name: Test update checker
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/updates.gd
      - name: Build universal macOS app
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64
        run: scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Botball-Lab-macOS
          path: build/Botball-Lab-macOS.zip

  dmg:
    needs: prototype
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and macOS export template
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_macos.universal.zip -o /tmp/godot-macos.zip
          ditto -x -k /tmp/godot-macos.zip /tmp/godot-bin
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.5.2.stable"
          unzip -p /tmp/templates.tpz templates/macos.zip > "$HOME/Library/Application Support/Godot/export_templates/4.5.2.stable/macos.zip"
      - name: Build and verify universal DMG
        env:
          GODOT_BIN: /tmp/godot-bin/Godot.app/Contents/MacOS/Godot
        run: scripts/build_dmg.sh
      - name: Publish versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump application version to publish an update."
            exit 0
          fi
          cat > /tmp/release-notes.md <<'NOTES'
          Установщик Botball Lab 0.10.0 для macOS на Apple Silicon и Intel.

          Скачайте Botball-Lab-macOS.dmg, откройте его и перенесите Botball Lab.app в «Программы». Для обновления закройте приложение и замените предыдущую версию. Сохранённые проекты сохраняются.

          - Контактный захват: постепенное закрытие губок, удержание силами сжатия и трения, проскальзывание при перегрузке и отпускание с сохранением скорости. Собственные губки управляются серво; груз нагружает привод.
          - Вращательные опоры и направляющие, передачи между шестернями и рейкой, гравитация подвижных узлов, пределы хода и остановка при перегрузке или внешнем препятствии. В конструкторе доступен пример «Реечный лифт».
          - Приближение камеры в playground, жесты трекпада, сдвиг Shift+ПКМ и центрирование на роботе клавишей F.
          - Момент моторов, инерция колёс, буксование, активное торможение и сцепление поверхности.
          - Обновлённые материалы, освещение и лабораторный стол. Переиспользование 3D-моделей, отмена/повтор и улучшенный предпросмотр креплений.

          Физика остаётся приближённой: параметры оборудования оценочные, коллайдеры деталей упрощены, передачи используют идеальные связи. Тросы, ремни, деформация и внутренние столкновения деталей одного робота не поддержаны. Контактный захват рассчитан на учебный куб.

          Приложение подписано ad-hoc и не нотариализировано Apple. Исходный код и лицензии моделей доступны в репозитории.
          NOTES
          gh release create "$TAG" build/Botball-Lab-macOS.dmg build/Botball-Lab-macOS.zip build/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Botball Lab $VERSION" --notes-file /tmp/release-notes.md --latest
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Botball-Lab-DMG
          path: |
            build/Botball-Lab-macOS.dmg
            build/SHA256SUMS.txt
