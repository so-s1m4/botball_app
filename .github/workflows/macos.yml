name: Test, build and release macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.2 and macOS template
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.request, zipfile
          base = 'https://github.com/godotengine/godot/releases/download/4.5.2-stable/'
          urllib.request.urlretrieve(base + 'Godot_v4.5.2-stable_linux.x86_64.zip', '/tmp/godot.zip')
          with zipfile.ZipFile('/tmp/godot.zip') as z:
              z.extractall('/tmp/godot-bin')
          os.chmod('/tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64', 0o755)
          urllib.request.urlretrieve(base + 'Godot_v4.5.2-stable_export_templates.tpz', '/tmp/templates.tpz')
          target = pathlib.Path.home() / '.local/share/godot/export_templates/4.5.2.stable'
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('/tmp/templates.tpz') as z:
              (target / 'macos.zip').write_bytes(z.read('templates/macos.zip'))
          PY
      - name: Import project
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --editor --import --quit
      - name: Test simulation
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/smoke.gd --fixed-fps 120
      - name: Test parts and constructor
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/parts.gd
      - name: Test mechanical connections
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/connections.gd
      - name: Test simple assembly
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/easy.gd
      - name: Test map switching and runtime GLB import
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/maps.gd
      - name: Test assembled robot actuators and programs
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/programs.gd --fixed-fps 120
      - name: Test ready robot on application startup
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/starter.gd --fixed-fps 120
      - name: Test update checker
        run: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/updates.gd
      - name: Build universal macOS app
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.5.2-stable_linux.x86_64
        run: scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Botball-Lab-macOS
          path: build/Botball-Lab-macOS.zip

  dmg:
    needs: prototype
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and macOS export template
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_macos.universal.zip -o /tmp/godot-macos.zip
          ditto -x -k /tmp/godot-macos.zip /tmp/godot-bin
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.5.2.stable"
          unzip -p /tmp/templates.tpz templates/macos.zip > "$HOME/Library/Application Support/Godot/export_templates/4.5.2.stable/macos.zip"
      - name: Build and verify universal DMG
        env:
          GODOT_BIN: /tmp/godot-bin/Godot.app/Contents/MacOS/Godot
        run: scripts/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Botball-Lab-DMG
          path: |
            build/Botball-Lab-macOS.dmg
            build/SHA256SUMS.txt
      - name: Publish versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump application version to publish an update."
            exit 0
          fi
          cat > /tmp/release-notes.md <<'NOTES'
          macOS installer for Apple Silicon and Intel.

          Download Botball-Lab-macOS.dmg, open it and drag Botball Lab.app into Applications.
          To update, quit Botball Lab and replace the previous app. Saved projects are preserved.
          The app checks for newer versions at startup; use «Обновления» to check manually.

          Includes a Python-like code editor: numbered motor and servo control, wait, drive, stop, variables, loops, conditions, print, virtual distance and encoder readings. Assembled motors/wheels drive the robot with its measured track; servo output rotates its attached horn. Programs are saved with projects. The physics and motor mounts remain simplified.

          Includes simple assembly: choose a platform, flip it, click highlighted motor mounts, fasten with inventory screws, and attach wheels. Placement preview and undo are included; the advanced connector editor remains available. Motor mounting locations are approximate teaching geometry.

          Includes map switching and runtime GLB import with materials, static collision, automatic fitting and saved map selection. The training task and controller remain educational rather than imported season rules.

          Includes a picture catalog for all 156 installable parts and textured plastic, metal and rubber finishes.

          Includes connection-based assembly: LEGO pins, axles, studs and 8-32/M3 fasteners. Connected groups move together and connections are saved with the project. Some connection geometry is approximate; full mechanical dynamics is not included.
          This build has an ad-hoc signature and is not Apple-notarized.
          Source code and third-party model licenses are included in this repository.
          NOTES
          gh release create "$TAG" build/Botball-Lab-macOS.dmg build/Botball-Lab-macOS.zip build/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Botball Lab $VERSION" --notes-file /tmp/release-notes.md --latest
