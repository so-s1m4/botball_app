[preset.0]
name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/parts/*.json,assets/parts/*.json,assets/parts/*.txt,assets/parts/*.zip"
exclude_filter="tests/*,docs/*,scripts/*,.github/*,server/*"
export_path="build/Botball-Lab-macOS.zip"
script_export_mode=2

[preset.0.options]
export/custom_template/debug=""
export/custom_template/release=""
application/icon="res://assets/icon.svg"
application/bundle_identifier="com.sos1m4.botballlab"
application/signature="BTBL"
application/app_category="Education"
application/short_version="0.10.0"
application/version="0.10.0"
application/copyright="Botball Lab contributors"
application/min_macos_version="10.13"
application/export_angle=0
codesign/codesign=1
codesign/entitlements/app_sandbox/enabled=false
codesign/entitlements/disable_library_validation=true
notarization/notarization=0

[preset.1]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/parts/*.json,assets/parts/*.json,assets/parts/*.txt,assets/parts/*.zip"
exclude_filter="tests/*,docs/*,scripts/*,.github/*,server/*"
export_path="build/web/index.html"
script_export_mode=2

[preset.1.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
